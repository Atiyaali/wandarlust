# ==========================================================
# GitLab CI/CD Pipeline
# ==========================================================
#
# Workflow
#
# 1. Validate Environment
# 2. Build Docker Image
# 3. Push Image to Amazon ECR
# 4. Configure Service
# 5. Register ECS Task Definition
# 6. Deploy to ECS
# 7. Configure Auto Scaling
# 8. Cleanup
#
# ==========================================================

default:
  tags:
    - majlis

  before_script:
    - apk add --no-cache aws-cli
    - export DOCKER_BUILDKIT=1

# ==========================================================
# Global Variables
# ==========================================================

variables:
  AWS_REGION: "ap-south-1"
  AWS_ACCOUNT_ID: "405634363888"

  NAMESPACE: "majlis-prod-api-ns"

  ECR_REGISTRY: "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
  ECR_REPOSITORY: "${NAMESPACE}/${CI_PROJECT_NAME}"

  ECS_CLUSTER: "majlis-prod-api-ecs-cluster"

  ECS_SERVICE: "${CI_PROJECT_NAME}-service"

  TASK_FAMILY: "${CI_PROJECT_NAME}-task"

  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

# ==========================================================
# Pipeline
# ==========================================================

pipeline:

  # --------------------------------------------------------
  # Run only for Production
  # --------------------------------------------------------

  rules:
    - if: "$CI_COMMIT_BRANCH == 'prod'"
    - if: "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'prod'"

  # --------------------------------------------------------
  # Cache
  # --------------------------------------------------------

  cache:
    key: "${CI_PROJECT_DIR}"

    untracked: true

    paths:
      - task-arn.txt
      - package*.json

  # --------------------------------------------------------
  # Pipeline Steps
  # --------------------------------------------------------

  script:

    # ======================================================
    # STEP 1 - Validation
    # ======================================================

    - echo "=============================================="
    - echo "Validate Environment"
    - echo "=============================================="

    - aws --version
    - docker --version

    - |
      aws ecr get-login-password \
      --region $AWS_REGION \
      | docker login \
      --username AWS \
      --password-stdin \
      $ECR_REGISTRY \
      || (echo "ECR Login Failed"; exit 1)

    # - sonar-scanner || echo "SonarQube scan optional"

    # ======================================================
    # STEP 2 - Build Docker Image
    # ======================================================

    - echo "=============================================="
    - echo "Build Docker Image"
    - echo "=============================================="

    - cp -v "$ENV" .env

    - |
      docker build \
      -t ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG} \
      .

    # ======================================================
    # STEP 3 - Push Image
    # ======================================================

    - echo "=============================================="
    - echo "Push Docker Image"
    - echo "=============================================="

    - |
      docker push \
      ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}

    # ======================================================
    # STEP 4 - Service Configuration
    # ======================================================

    - echo "=============================================="
    - echo "Configure Service"
    - echo "=============================================="

    - |

      case "$CI_PROJECT_NAME" in

        majlis_comment_microservice)

          PORT=5005

          TARGET_GROUP_ARN="arn:aws:elasticloadbalancing:ap-south-1:405634363888:targetgroup/majlis-comment-tg/11500eef8207d5d2"

          ;;

        *)

          echo "Unknown service"

          exit 1

          ;;

      esac

    # ======================================================
    # STEP 5 - Register ECS Task Definition
    # ======================================================

    - echo "=============================================="
    - echo "Register ECS Task Definition"
    - echo "=============================================="

    - >

      if [ ! -f task-arn.txt ] ||

         [ "$(aws ecs describe-task-definition
         --task-definition $TASK_FAMILY
         --query 'taskDefinition.containerDefinitions[0].image'
         --output text)" !=
         "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" ];

      then

        aws ecs register-task-definition \
          --family ${TASK_FAMILY} \
          --network-mode awsvpc \
          --requires-compatibilities FARGATE \
          --cpu 256 \
          --memory 512 \
          --execution-role-arn arn:aws:iam::${AWS_ACCOUNT_ID}:role/ecsTaskExecutionRole \
          --task-role-arn arn:aws:iam::${AWS_ACCOUNT_ID}:role/ecsTaskExecutionRole \
          --container-definitions "[{\"name\":\"${CI_PROJECT_NAME}\",\"image\":\"${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}\",\"portMappings\":[{\"containerPort\":${PORT},\"protocol\":\"tcp\"}],\"logConfiguration\":{\"logDriver\":\"awslogs\",\"options\":{\"awslogs-group\":\"/ecs/${TASK_FAMILY}\",\"awslogs-region\":\"${AWS_REGION}\",\"awslogs-stream-prefix\":\"ecs\"}}}]" \
          --query 'taskDefinition.taskDefinitionArn' \
          --output text \
          > task-arn.txt

      fi

    - cat task-arn.txt
    # ======================================================
    # STEP 6 - Deploy to Amazon ECS
    # ======================================================

    - echo "=============================================="
    - echo "Deploy to Amazon ECS"
    - echo "=============================================="

    - >

      if ! aws ecs describe-services \
        --cluster "$ECS_CLUSTER" \
        --services "$ECS_SERVICE" \
        --query "services[?status=='ACTIVE'] | length(@)" \
        --output text | grep -q '^1$';

      then

        echo "Service does not exist or is not active."

        echo "Creating ECS Service..."

        aws ecs create-service \
          --cluster "$ECS_CLUSTER" \
          --service-name "$ECS_SERVICE" \
          --task-definition "$(cat task-arn.txt)" \
          --desired-count 1 \
          --launch-type FARGATE \
          --network-configuration "awsvpcConfiguration={subnets=[subnet-001f47b6e7afd4f4d,subnet-0c343074f08705445],securityGroups=[sg-0fbb45e9e2435c159],assignPublicIp=DISABLED}" \
          --load-balancers "targetGroupArn=${TARGET_GROUP_ARN},containerName=${CI_PROJECT_NAME},containerPort=${PORT}" \
          --scheduling-strategy REPLICA \
          --deployment-controller type=ECS \
          --enable-ecs-managed-tags \
          --propagate-tags SERVICE \
          --disable-execute-command \
          --service-connect-configuration '{"enabled":true,"namespace":"'"$NAMESPACE"'"}' \
          --health-check-grace-period-seconds 120 \
          --deployment-configuration "maximumPercent=200,minimumHealthyPercent=100,deploymentCircuitBreaker={enable=true,rollback=true}"

      else

        echo "Service already exists."

        echo "Checking task definition..."

        if [ -f task-arn.txt ] && \
           [ "$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --query 'services[0].taskDefinition' \
              --output text)" != "$(cat task-arn.txt)" ];

        then

          echo "New Task Definition Found"

          echo "Updating ECS Service"

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$(cat task-arn.txt)" \
            --force-new-deployment

        else

          echo "Task Definition unchanged."

        fi

      fi

    # ======================================================
    # STEP 7 - Auto Scaling
    # ======================================================

    # One-time scaling setup (runs only if scaling policy doesn't exist)

    # - >
    #   if ! aws application-autoscaling describe-scaling-policies \
    #      --service-namespace ecs \
    #      --resource-id service/$ECS_CLUSTER/$ECS_SERVICE \
    #      --query "ScalingPolicies[?PolicyName=='cpu-scaling'].PolicyName" \
    #      --output text | grep -q cpu-scaling;
    #
    #   then
    #
    #     echo "Register the scalable target (min 1, max 10 tasks)";
    #
    #     aws application-autoscaling register-scalable-target \
    #       --service-namespace ecs \
    #       --resource-id service/$ECS_CLUSTER/$ECS_SERVICE \
    #       --scalable-dimension ecs:service:DesiredCount \
    #       --min-capacity 1 \
    #       --max-capacity 10 \
    #       --suspended-state DynamicScalingInSuspended=true,DynamicScalingOutSuspended=true,ScheduledScalingSuspended=true;
    #
    #     echo "Create the CPU-utilization target-tracking policy";
    #
    #     aws application-autoscaling put-scaling-policy \
    #       --service-namespace ecs \
    #       --resource-id service/$ECS_CLUSTER/$ECS_SERVICE \
    #       --scalable-dimension ecs:service:DesiredCount \
    #       --policy-name cpu-scaling \
    #       --policy-type TargetTrackingScaling \
    #       --target-tracking-scaling-policy-configuration '{"TargetValue":70.0,"PredefinedMetricSpecification":{"PredefinedMetricType":"ECSServiceAverageCPUUtilization"},"ScaleOutCooldown":60,"ScaleInCooldown":300}';
    #
    #   fi

    # ======================================================
    # STEP 8 - Cleanup
    # ======================================================

    - echo "=============================================="
    - echo "Cleanup"
    - echo "=============================================="

    - docker system prune --filter "until=72h" -af

  # ========================================================
  # Artifacts
  # ========================================================

  artifacts:

    paths:

      - task-arn.txt

      - package*.json

    expire_in: 120h