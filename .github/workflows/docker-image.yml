name: Docker Image CI
on: 
  push:
    branches: [main , staging]
  pull_request: 
    branches: [main, staging]
jobs:
  #here docker is the job and github assign seperate server for each job to run the steps
  validate:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017

      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      MONGODB_URI: mongodb://localhost:27017/wanderlust_test
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      # - name: Installing Frontend dependencies
      #   run: |
      #     cd frontend
      #     npm ci
      - name: Installing Backend dependencies
        run: |
          cd backend
          npm ci   
      # - name: Linting frontned
      #   run: |
      #     cd frontend
      #     npm run lint
      - name: Linting Backend
        run: |
          cd backend
          npm run lint
      # - name: Testing Frontend
      #   run: |
      #     cd frontend
      #     npm test -- --detectOpenHandles --runInBand
      - name: Testing backend
        run: |
          cd backend
          npm test -- --detectOpenHandles --runInBand
  Docker:
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}
      - name: Build Backend Image
        run: |
          docker build \
          -f backend/Dockerfile \
          -t atiyaali/wanderlust-backend:${{ github.sha }} \
          -t atiyaali/wanderlust-backend:latest \
          .
      
      - name: Build Frontend Image
        run: |
          docker build \
          -f frontend/Dockerfile \
          -t atiyaali/wanderlust-frontend:${{ github.sha }} \
          -t atiyaali/wanderlust-frontend:latest \
          .
      - name: Build Nginx Image
        run: |
          docker build \
          -f nginx/Dockerfile \
          -t atiyaali/wanderlust-nginx:${{ github.sha }} \
          -t atiyaali/wanderlust-nginx:latest \
          .
      - name: trivy scan frontend image
        run: |
          docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:latest image \
          --timeout 15m \
          --scanners vuln \
          --db-repository ghcr.io/aquasecurity/trivy-db \
          atiyaali/wanderlust-frontend:${{ github.sha }}
      - name: trivy scan backend image
        run: |
          docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:latest image \
          --timeout 15m \
          --scanners vuln \
          --db-repository ghcr.io/aquasecurity/trivy-db \
          atiyaali/wanderlust-backend:${{ github.sha }}

      - name: trivy scan nginx image
        run: |
          docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:latest image \
          --timeout 15m \
          --scanners vuln \
          --db-repository ghcr.io/aquasecurity/trivy-db \
          atiyaali/wanderlust-nginx:${{ github.sha }}
      - name: push backend image
        run: |
          docker push atiyaali/wanderlust-backend:${{ github.sha }}
          docker push atiyaali/wanderlust-backend:latest
      - name: push frontend image
        run: |
          docker push atiyaali/wanderlust-frontend:${{ github.sha }}
          docker push atiyaali/wanderlust-frontend:latest
      - name: push nginx image
        run: |
          docker push atiyaali/wanderlust-nginx:${{ github.sha }}
          docker push atiyaali/wanderlust-nginx:latest
