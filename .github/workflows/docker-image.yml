name: Docker Image CI
on: 
  push:
    branches: [main , staging]
  pull_request: 
    branches: [main, staging]
jobs:
  #here docker is the job and github assign seperate server for each job to run the steps
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Installing Frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Installing Backend dependencies
        run: |
          cd backend
          npm ci   
      - name: Linting frontned
        run: |
          cd frontend
          npm run lint
      - name: Linting Backend
        run: |
          cd backend
          npm run lint
      - name: Testing Frontend
        run: |
          cd frontend
          npm test -- --detectOpenHandles --runInBand
      - name: Testing backend
        run: |
          cd backend
          npm test -- --detectOpenHandles --runInBand
  Docker:
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}
      - name: Build Backend Image
        run: |
          docker build \
          -t atiyadocker/wanderlust-backend:${{ github.sha }} \
          -t atiyadocker/wanderlust-backend:latest \
          ./backend
      
      - name: Build Frontend Image
        run: |
          docker build \
          -t atiyadocker/wanderlust-frontend:${{ github.sha }} \
          -t atiyadocker/wanderlust-frontend:latest \
          ./frontend
      - name: Build Nginx Image
        run: |
          docker build \
          -t atiyadocker/wanderlust-nginx:${{ github.sha }} \
          -t atiyadocker/wanderlust-nginx:latest \
          ./nginx
      - name: trivy scan frontend image
        run: |
          docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:latest image \
          --timeout 15m \
          --exit-code 1 \
          --severity HIGH,CRITICAL \
          atiyadocker/wanderlust-frontend:${{ github.sha }}
      - name: trivy scan backend image
        run: |
          docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:latest image \
          --exit-code 1 \
          --severity HIGH,CRITICAL \
          --timeout 15m \
          atiyadocker/wanderlust-backend:${{ github.sha }}

      - name: trivy scan nginx image
        run: |
          docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:latest image \
          --timeout 15m \
          --exit-code 1 \
          --severity HIGH,CRITICAL \
          atiyadocker/wanderlust-nginx:${{ github.sha }}
      - name: push backend image
        run: |
          docker push atiyadocker/wanderlust-backend:${{ github.sha }}
          docker push atiyadocker/wanderlust-backend:latest
      - name: push frontend image
        run: |
          docker push atiyadocker/wanderlust-frontend:${{ github.sha }}
          docker push atiyadocker/wanderlust-frontend:latest
      - name: push nginx image
        run: |
          docker push atiyadocker/wanderlust-nginx:${{ github.sha }}
          docker push atiyadocker/wanderlust-nginx:latest
