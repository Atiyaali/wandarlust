apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}
  # namespace: redis-namespace
  labels:
    app: {{ .Values.appName }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
    spec:
      containers:
        - name: {{ .Values.appName }}
          image: "{{ .Values.appImage }}:{{ .Values.appVersion }}"
          # command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
          ports:
            - containerPort: {{ .Values.containerPort }}
              name: redis
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"