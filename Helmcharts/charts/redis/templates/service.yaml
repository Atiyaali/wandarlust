apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.appName }}
  # namespace: redis-namespace
  labels:
    app: {{ .Values.appName }}
spec:
  type: {{ .Values.serviceType }}
  ports:
    - port: {{ .Values.servicePort }}
      targetPort: {{ .Values.containerPort }}
      name: redis
  selector:
    app: {{ .Values.appName }}